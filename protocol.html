<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личное дело №001 | Даниил и Диана</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #d8d8d8;
  color: #111;
  font-family: "Courier New", monospace;
}

.site {
  max-width: 430px;
  margin: 0 auto;
  background: #f6f1e7;
  min-height: 100vh;
  overflow: hidden;
}

section {
  position: relative;
  padding: 60px 24px;
  background: #f6f1e7;
}

h1, h2 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 1.1;
}

h1 {
  font-size: 36px;
}

h2 {
  font-size: 30px;
  margin-bottom: 20px;
}

p {
  font-size: 16px;
  line-height: 1.45;
  margin: 16px 0;
}

.open-screen {
  position: fixed;
  inset: 0;
  background: #f6f1e7;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: 0.8s;
}

.open-screen.hide {
  opacity: 0;
  pointer-events: none;
}

.open-box {
  border: 2px solid #111;
  padding: 50px 30px;
  width: 82%;
}

.open-box button {
  margin-top: 40px;
  border: 4px double #9d1f2f;
  color: #9d1f2f;
  background: transparent;
  padding: 10px 25px;
  font-size: 24px;
  font-weight: 900;
  transform: rotate(-5deg);
  cursor: pointer;
}

.cover {
  min-height: 100vh;
  border: 2px solid #111;
  margin: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
  position: relative;
}

.scroll-hint{
  position:absolute;
  bottom:38px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;

  color:#9d1f2f;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;

  opacity:.85;
  transition:.6s;

  animation:hintFloat 2s ease-in-out infinite;
}

.scroll-hint.hide{
  opacity:0;
  pointer-events:none;
}

.arrow{
  font-size:38px;
  line-height:1;
  text-shadow:0 0 8px rgba(157,31,47,.35);
}

@keyframes hintFloat{
  0%{
    transform:translateX(-50%) translateY(0);
  }

  50%{
    transform:translateX(-50%) translateY(10px);
  }

  100%{
    transform:translateX(-50%) translateY(0);
  }
}

.case-number {
  font-size: 28px;
  margin: 20px 0 55px;
}

.hand {
  font-family: "Brush Script MT", "Comic Sans MS", cursive;
  font-size: 28px;
  border-bottom: 2px solid #111;
  padding: 0 8px;
}

.reveal {
  opacity: 0;
  transform: translateY(35px);
  transition: 0.8s ease;
}

.active {
  opacity: 1;
  transform: translate(0);
}
</style>
</head>

<body>

<div class="open-screen" id="openScreen">
  <div class="open-box">
    <h1>Личное дело<br>№001</h1>
    <p>о задержании граждан<br>с целью последующего<br>бракосочетания</p>
    <button>ОТКРЫТЬ</button>
  </div>
</div>

<main class="site">

<section class="cover">

<div class="scroll-hint" id="scrollHint">
  <div class="arrow">⌄</div>
  <span>Листайте ниже</span>
</div>

  <div class="reveal">
    <h1>Личное дело</h1>
    <div class="case-number">№ <span class="hand">001</span></div>
    <p>о задержании граждан<br>с целью последующего<br>бракосочетания</p>
  </div>

</section>

</main>

<script>
function animateOnScroll() {
  document.querySelectorAll(".reveal").forEach(function (el) {
    const rect = el.getBoundingClientRect();

    if (rect.top < window.innerHeight - 60) {
      el.classList.add("active");
    }
  });
}

window.addEventListener("scroll", animateOnScroll);
window.addEventListener("load", animateOnScroll);

const scrollHint = document.getElementById("scrollHint");

window.addEventListener("scroll", function () {

  if(window.scrollY > 40){
    scrollHint.classList.add("hide");
  } else {
    scrollHint.classList.remove("hide");
  }

});
</script>

</body>
</html>
